# Build the website (site/), check it, and deploy it to GitHub Pages.
# Needs: Settings → Pages → Source: GitHub Actions. Runs only when the website or docs change; never builds the driver.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod dates come from git history
          sparse-checkout: |
            site
            docs
            README.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            LICENSE
      - name: Build
        run: python3 site/build.py
      - name: Check site and docs
        run: python3 site/check.py --markdown
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
