name: Feature request
description: Suggest something PSVR2-DriverKit should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap in the README](https://github.com/mkooner/PSVR2-DriverKit#roadmap) and existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: context
    attributes:
      label: Anything else (games or apps involved, how other headsets handle it)
