[package]
name = "psvr2-driverkit"
version = "0.1.0"
edition = "2021"
description = "PSVR2-DriverKit: launcher for the PS VR2 Monado build: SteamVR, monado-service, OpenXR apps, settings"
license = "BSL-1.0"

[[bin]]
name = "PSVR2-DriverKit"
path = "src/main.rs"

[dependencies]
eframe = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
rfd = "0.15"
png = "0.18"

[profile.release]
opt-level = 2
